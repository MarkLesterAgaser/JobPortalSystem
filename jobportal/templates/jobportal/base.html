<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{% block title %}Job Portal{% endblock %}</title>
<style>
  body { font-family: Cambria, serif; margin: 0; background: #f7f7f7; color: #222; }
  header { background: #c2185b; color: #fff; padding: 14px 30px; }
  header a { color: #fff; text-decoration: none; margin-right: 20px; font-weight: bold; }
  main { max-width: 1000px; margin: 24px auto; padding: 0 20px; }
  table { width: 100%; border-collapse: collapse; background: #fff; }
  th { background: #c2185b; color: #fff; text-align: left; }
  th, td { padding: 10px; border: 1px solid #e0e0e0; }
  .btn { display: inline-block; padding: 7px 14px; background: #c2185b; color: #fff; border: 0; border-radius: 4px; text-decoration: none; cursor: pointer; font-size: 14px; }
  .btn.gray { background: #757575; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-weight: bold; margin-bottom: 4px; }
  .field input, .field select, .field textarea { width: 100%; padding: 8px; box-sizing: border-box; }
  .error { color: #c62828; font-size: 13px; }
  .msg { padding: 10px; background: #e8f5e9; border: 1px solid #a5d6a7; margin-bottom: 14px; }
  .badge { padding: 2px 8px; border-radius: 10px; font-size: 12px; }
  .badge.active { background: #c8e6c9; }
  .badge.inactive { background: #ffcdd2; }
  .bar { display: flex; gap: 8px; margin-bottom: 16px; }
  .bar input, .bar select { padding: 7px; }
</style>
</head>
<body>
<header>
  <a href="{% url 'employer_list' %}">Employers</a>
  <a href="/admin/">Admin</a>
</header>
<main>
  {% for message in messages %}
    <div class="msg">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
