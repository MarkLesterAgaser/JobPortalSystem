<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Job Portal{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2a2127;
    --muted: #6b5f66;
    --paper: #faf6f8;
    --surface: #ffffff;
    --line: #e8dde2;
    --pine: #c2185b;
    --pine-dark: #9c1349;
    --good: #2f855a;
    --idle: #a99ca3;
    --bad: #a12622;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Public Sans", "Segoe UI", Arial, sans-serif;
    font-size: 15px; line-height: 1.5;
  }

  .shell { display: flex; min-height: 100vh; }
  .side {
    width: 220px; flex-shrink: 0; background: var(--pine);
    padding: 28px 20px; position: sticky; top: 0; height: 100vh;
  }
  .brand {
    display: block; color: #fff; font-size: 1.35rem; font-weight: 700;
    letter-spacing: -0.01em; text-decoration: none; margin-bottom: 32px;
  }
  .side nav a {
    display: block; color: #fbd3e1; text-decoration: none;
    padding: 8px 10px; margin: 0 -10px 2px; border-radius: 4px;
  }
  .side nav a:hover, .side nav a.current { background: var(--pine-dark); color: #fff; }
  .side nav a.current { font-weight: 600; box-shadow: inset 3px 0 0 #f06292; }
  main { flex: 1; min-width: 0; max-width: 1100px; padding: 32px 40px 60px; }

  h2 { font-size: 1.6rem; line-height: 1.2; margin: 0 0 20px; letter-spacing: -0.01em; }
  h3 { font-size: 1.05rem; margin: 28px 0 8px; }
  h2 .badge { margin-left: 10px; font-size: 0.9rem; font-weight: 400; }
  a { color: var(--pine); }
  .summary { font-size: 1.05rem; margin: 0 0 24px; }

  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 600; color: var(--muted); font-size: 0.9rem; }
  tr:last-child th, tr:last-child td { border-bottom: 0; }
  tr:hover td { background: #fbeff4; }

  .btn {
    display: inline-block; padding: 8px 14px; background: var(--pine); color: #fff;
    border: 1px solid var(--pine); border-radius: 4px; font: inherit; font-weight: 600;
    text-decoration: none; cursor: pointer;
  }
  .btn:hover { background: var(--pine-dark); }
  .btn.gray { background: transparent; color: var(--ink); border-color: #cdbfc6; }
  .btn.gray:hover { background: #f3e9ee; }
  .link-btn {
    background: none; border: 0; padding: 0; color: var(--pine);
    text-decoration: underline; cursor: pointer; font: inherit;
  }
  form.inline { display: inline; margin-left: 12px; }

  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
  main form:not(.bar):not(.inline) { max-width: 560px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-weight: 600; margin-bottom: 4px; }
  input[type=text], input[type=email], input[type=url], input[type=date],
  input[type=number], select, textarea {
    padding: 8px 10px; border: 1px solid #cdbfc6; border-radius: 4px;
    background: #fff; color: var(--ink); font: inherit;
  }
  .field input[type=text], .field input[type=email], .field input[type=url],
  .field input[type=date], .field input[type=number], .field select, .field textarea { width: 100%; }
  .field input[type=checkbox] { width: auto; margin-right: 6px; }
  .errorlist { margin: 4px 0 0; padding: 0; list-style: none; }
  .error { color: var(--bad); font-size: 0.9rem; margin-top: 4px; }

  .msg { border-left: 3px solid var(--pine); background: #fce9f0; padding: 10px 14px; margin-bottom: 16px; }

  .badge { display: inline-flex; align-items: center; gap: 6px; }
  .badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--idle); }
  .badge.active::before { background: var(--good); }
  .badge.inactive::before { background: var(--idle); }

  main :focus-visible { outline: 2px solid var(--pine); outline-offset: 2px; }
  .side :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  @media (max-width: 800px) {
    .shell { display: block; }
    .side { position: static; width: auto; height: auto; padding: 14px 16px; }
    .brand { margin-bottom: 10px; }
    .side nav { display: flex; flex-wrap: wrap; gap: 6px; }
    .side nav a { margin: 0; }
    main { padding: 20px 16px 40px; }
    table { display: block; overflow-x: auto; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <a class="brand" href="{% url 'employer_list' %}">Job Portal</a>
    <nav>
      <a href="{% url 'employer_list' %}" {% if request.path == '/' or '/employers' in request.path %}class="current"{% endif %}>Employers</a>
      <a href="{% url 'category_list' %}" {% if '/categories' in request.path %}class="current"{% endif %}>Job categories</a>
      <a href="/admin/">Admin</a>
    </nav>
  </aside>
  <main>
    {% for message in messages %}
      <div class="msg">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
