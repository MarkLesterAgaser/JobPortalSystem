{% extends 'jobportal/base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h2>{{ title }}</h2>
<form method="post">
  {% csrf_token %}
  {% for field in form %}
    <div class="field">
      {{ field.label_tag }}
      {{ field }}
      {% if field.errors %}<div class="error">{{ field.errors }}</div>{% endif %}
    </div>
  {% endfor %}
  <button class="btn" type="submit">Save enrollment</button>
  <a class="btn gray" href="{% url 'enrollment_list' %}">Cancel</a>
</form>
{% endblock %}
